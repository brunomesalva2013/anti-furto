name: Testar ESCUDO IA no emulador
on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-emulator-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Preparar aceleracao de emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar e abrir no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n br.com.escudoia/.MainActivity
            sleep 8
            adb shell dumpsys activity activities > atividades.txt
            if ! grep -q "br.com.escudoia" atividades.txt; then
              echo "A tela da ESCUDO IA nao foi localizada."
              exit 1
            fi
            adb logcat -d -s AndroidRuntime:E > crashes.txt
            if grep -q "FATAL EXCEPTION" crashes.txt; then
              echo "O emulador registrou uma falha fatal."
              cat crashes.txt
              exit 1
            fi
            adb exec-out screencap -p > tela-escudo-ia.png
      - name: Salvar tela e diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ESCUDO-IA-Emulador-Screenshot
          path: |
            tela-escudo-ia.png
            crashes.txt
            atividades.txt
          if-no-files-found: warn
